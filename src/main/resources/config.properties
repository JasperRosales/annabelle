# TalkCare desktop configuration.
# The desktop app holds no database credentials: all data goes through the TalkCare API.

# Base URL of the TalkCare API (talkcare-api repository, deployed on Render). For a local
# API use http://localhost:4000. Override at launch with the
# TALKCARE_API_URL environment variable or -Dtalkcare.api.url=...
api.baseUrl=https://talkcare-api.onrender.com

# Local port the desktop shell uses to serve the UI to its embedded WebView.
ui.port=54321
