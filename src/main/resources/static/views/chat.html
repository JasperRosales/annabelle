<!-- CHAT MESSENGER VIEW (Page 6 & Page 7) -->
<section class="view-screen" id="view-chat">
  <div class="chat-window-container">
    <!-- Left Sidebar: Conversations / Handlers -->
    <aside class="chat-sidebar">
      <div class="chat-sidebar-header">
        <div class="chat-sidebar-title">Chats</div>
        <input type="text" class="chat-search-input" placeholder="Search Conversation...." id="chat-search-box" oninput="filterChatThreads(this.value)">
      </div>

      <div class="chat-thread-list" id="chat-thread-list">
      </div>
    </aside>

    <!-- Main Chat Area -->
    <div class="chat-main-area">
      <!-- Top Bar -->
      <div class="chat-top-bar">
        <div class="chat-top-left">
          <button class="chat-back-button" type="button" onclick="navigateTo('services')" aria-label="Back to services">
            <span aria-hidden="true">&larr;</span> BACK
          </button>
          <img src="assets/seal-justicecare.svg" alt="Seal" class="chat-service-seal" id="chat-service-seal">
          <div class="chat-service-title" id="chat-service-header-title">JusticeCare</div>
        </div>

        <div class="chat-prof-badge" onclick="openProfessionalModal()" title="View Professional Credentials">
          <img src="assets/avatar-case-handler.svg" alt="Professional" class="chat-prof-avatar" id="chat-header-avatar">
          <span class="chat-prof-name" id="chat-header-name">Name of Case Handlers</span>
          <span class="verified-icon" title="Verified Professional">&#10004;</span>
        </div>
      </div>

      <!-- Message Bubbles Container -->
      <div class="chat-messages-container" id="chat-messages-box">
        <!-- Messages rendered dynamically -->
      </div>

      <!-- Bottom Message Input Bar -->
      <form class="chat-input-bar" onsubmit="handleSendMessage(event)">
        <div class="chat-attachment-preview" id="chat-attachment-preview" hidden></div>
        <div class="chat-form-status" id="chat-send-status" role="status" aria-live="polite"></div>
        <input type="text" class="chat-input-field" placeholder="Type your concerns....." id="chat-text-input" autocomplete="off">
        <button type="button" class="chat-action-btn" title="Attach Document / Photo" onclick="document.getElementById('chat-file-input').click()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        </button>
        <input type="file" id="chat-file-input" accept="image/png,image/jpeg" style="display: none;" onchange="handleChatFileUpload(event)">

        <button type="submit" class="chat-send-btn" title="Send Message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </form>
    </div>
  </div>
</section>
