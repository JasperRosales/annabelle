<!-- TALKCARE CHATBOT VIEW (AI assistant powered by Gemini, guarded by ChatGuardrails) -->
<section class="view-screen" id="view-assistant">
  <div class="chat-window-container">
    <aside class="chat-sidebar">
      <div class="chat-sidebar-header">
        <div class="chat-sidebar-title">Chats</div>
      </div>
      <div class="chat-thread-list">
        <button class="chat-thread-item active" type="button">
          <img class="chat-thread-avatar" src="assets/talkcare-logo.png" alt="">
          <span class="chat-thread-meta">
            <span class="chat-thread-name">TalkCare Chatbot</span>
            <span class="chat-thread-preview">AI support assistant</span>
          </span>
        </button>
      </div>
      <p class="assistant-disclaimer">
        The TalkCare Chatbot is an AI. It is not a lawyer or therapist and can make mistakes.
        Don't share passwords, ID numbers or bank details. In an emergency call <strong>911</strong>
        or the NCMH Crisis Hotline <strong>1553</strong>.
      </p>
    </aside>

    <div class="chat-main-area">
      <div class="chat-top-bar">
        <div class="chat-top-left">
          <button class="chat-back-button" type="button" data-action="navigate" data-arg="services" aria-label="Back to services">
            <span aria-hidden="true">&larr;</span> BACK
          </button>
          <img src="assets/talkcare-logo.png" alt="TalkCare" class="chat-service-seal">
          <div class="chat-service-title">TalkCare Chatbot</div>
        </div>
        <div class="chat-prof-badge">
          <span class="chat-prof-name">AI assistant</span>
          <button type="button" class="assistant-clear-btn" data-action="assistant-clear" title="Start a new conversation">New chat</button>
        </div>
      </div>

      <div class="chat-messages-container" id="assistant-messages-box"></div>

      <form class="chat-input-bar" data-submit="assistant-send">
        <div class="chat-form-status" id="assistant-status" role="status" aria-live="polite"></div>
        <input type="text" class="chat-input-field" placeholder="Ask about coping, your rights, or using TalkCare..." id="assistant-input" autocomplete="off" maxlength="800">
        <button type="submit" class="chat-send-btn" title="Send Message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </form>
    </div>
  </div>
</section>
