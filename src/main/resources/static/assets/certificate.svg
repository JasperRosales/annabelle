<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <!-- Outer border -->
  <rect x="5" y="5" width="310" height="210" rx="8" fill="#FFFFFF" stroke="#8E24AA" stroke-width="4" />
  <rect x="12" y="12" width="296" height="196" rx="4" fill="#FAFAFA" stroke="#BA68C8" stroke-width="1.2" stroke-dasharray="4,2" />

  <!-- Certificate Heading -->
  <text x="160" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7B1FA2" text-anchor="middle" letter-spacing="1.5">THIS CERTIFIES THAT</text>
  
  <text x="160" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#212121" text-anchor="middle">Adult</text>
  <text x="160" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#4A148C" text-anchor="middle">Mental Health First Aid USA</text>

  <!-- Cross / First Aid Emblem -->
  <g transform="translate(145, 102)">
    <rect x="10" y="0" width="10" height="30" fill="#E53935" rx="2" />
    <rect x="0" y="10" width="30" height="10" fill="#E53935" rx="2" />
  </g>

  <!-- Accreditation info -->
  <text x="160" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#616161" text-anchor="middle">has successfully completed the curriculum and demonstrated</text>
  <text x="160" y="164" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#616161" text-anchor="middle">proficiency in Mental Health Support & Intervention.</text>

  <!-- Signatures -->
  <line x1="50" y1="188" x2="110" y2="188" stroke="#424242" stroke-width="1" />
  <text x="80" y="198" font-family="'Brush Script MT', cursive, sans-serif" font-size="12" fill="#1A237E" text-anchor="middle">C. Reynolds</text>
  <text x="80" y="206" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" fill="#9E9E9E" text-anchor="middle">Instructor</text>

  <line x1="210" y1="188" x2="270" y2="188" stroke="#424242" stroke-width="1" />
  <text x="240" y="198" font-family="'Brush Script MT', cursive, sans-serif" font-size="12" fill="#1A237E" text-anchor="middle">M. Henderson</text>
  <text x="240" y="206" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" fill="#9E9E9E" text-anchor="middle">Director</text>
</svg>

