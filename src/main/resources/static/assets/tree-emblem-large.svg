      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F1F8E9" />
      <stop offset="100%" stop-color="#C8E6C9" />
    </radialGradient>
    <linearGradient id="treeLush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="120" cy="120" r="115" fill="url(#emblemBg)" stroke="#2E7D32" stroke-width="6" />
  <circle cx="120" cy="120" r="105" fill="none" stroke="#81C784" stroke-width="2" stroke-dasharray="6,4" />

