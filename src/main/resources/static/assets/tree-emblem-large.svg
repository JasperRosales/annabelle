    <path d="M38 52 C38 46 32 40 26 36 C30 42 34 52 38 64 Z" fill="#2E7D32" />
    <path d="M46 52 C46 46 52 40 58 36 C54 42 50 52 46 64 Z" fill="#1B5E20" />
