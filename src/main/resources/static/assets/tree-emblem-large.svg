    <path d="M42 22 Q48 30 42 38 Q36 30 42 22" fill="#81C784" />
    <path d="M28 42 Q36 45 32 52" stroke="#A5D6A7" stroke-width="2" fill="none" />
    <path d="M56 42 Q48 45 52 52" stroke="#A5D6A7" stroke-width="2" fill="none" />

