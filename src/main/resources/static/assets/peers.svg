<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="skinP1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFE0B2" />
      <stop offset="100%" stop-color="#FFCC80" />
    </radialGradient>
    <radialGradient id="skinP2" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFD180" />
      <stop offset="100%" stop-color="#FFA726" />
    </radialGradient>
  </defs>

  <!-- Left Peer -->
  <g transform="translate(10, 0)">
    <!-- Body / Yellow Jacket -->
    <path d="M42 98 L36 160 L68 160 L64 98 Z" fill="#FBC02D" />
    <rect x="48" y="85" width="8" height="15" fill="url(#skinP1)" />
    <!-- Head -->
    <circle cx="52" cy="70" r="16" fill="url(#skinP1)" />
    <!-- Hair -->
    <path d="M36 68 C36 50 68 50 68 68 C66 56 58 58 52 60 C46 58 38 56 36 68 Z" fill="#3E2723" />
    <!-- Eyes & Smile -->
    <circle cx="48" cy="69" r="1.5" fill="#212121" />
    <circle cx="56" cy="69" r="1.5" fill="#212121" />
    <path d="M50 74 Q52 77 55 74" stroke="#D84315" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Right Peer -->
  <g transform="translate(15, 0)">
    <!-- Body / Coral Red Coat -->
    <path d="M74 95 L68 160 L102 160 L98 95 Z" fill="#E53935" />
    <rect x="82" y="82" width="8" height="15" fill="url(#skinP2)" />
    <!-- Head -->
    <circle cx="86" cy="67" r="16" fill="url(#skinP2)" />
    <!-- Hair (long dark hair) -->
    <path d="M70 65 C70 46 102 46 102 65 C102 85 98 100 96 110 L90 110 C92 95 98 80 86 70 C80 75 74 72 70 65 Z" fill="#263238" />
    <!-- Face details -->
    <circle cx="82" cy="66" r="1.5" fill="#212121" />
    <circle cx="90" cy="66" r="1.5" fill="#212121" />
    <path d="M84 72 Q86 75 89 72" stroke="#B71C1C" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Tote Bag -->
    <rect x="94" y="115" width="20" height="28" rx="2" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1.5" />
    <path d="M98 115 C98 105 110 105 110 115" stroke="#78909C" stroke-width="2" fill="none" />
  </g>

  <!-- Hug / Friendly Arm Connection -->
  <path d="M60 105 Q75 115 84 105" stroke="#F57F17" stroke-width="6" stroke-linecap="round" fill="none" />
</svg>

