<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" preserveAspectRatio="none">
  <defs>
    <linearGradient id="warmSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5f45" />
      <stop offset="40%" stop-color="#738b69" />
      <stop offset="70%" stop-color="#b4976c" />
      <stop offset="100%" stop-color="#5a4d3b" />
    </linearGradient>
    <radialGradient id="sunburst" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF3E0" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FFE0B2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3E2723" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#warmSun)" />
  <rect width="1200" height="480" fill="url(#sunburst)" />

  <!-- Warm Silhouettes of People / Support circle -->
  <g fill="#212f1f" opacity="0.45">
    <!-- Person 1 -->
    <circle cx="220" cy="270" r="42" />
    <path d="M160 480 C160 360 200 330 220 330 C240 330 280 360 280 480 Z" />
    
    <!-- Person 2 -->
    <circle cx="360" cy="250" r="38" />
    <path d="M305 480 C305 340 340 310 360 310 C380 310 415 340 415 480 Z" />

    <!-- Person 3 (listening) -->
    <circle cx="510" cy="265" r="40" />
    <path d="M450 480 C450 355 490 325 510 325 C530 325 570 355 570 480 Z" />

    <!-- Person 4 -->
    <circle cx="700" cy="245" r="44" />
    <path d="M635 480 C635 330 680 305 700 305 C720 305 765 330 765 480 Z" />

    <!-- Person 5 & 6 holding hands -->
    <circle cx="860" cy="260" r="38" />
    <path d="M810 480 C810 345 845 320 860 320 C875 320 910 345 910 480 Z" />
    <circle cx="980" cy="255" r="40" />
    <path d="M925 480 C925 340 965 315 980 315 C995 315 1035 340 1035 480 Z" />
  </g>

  <!-- Dark green vignette overlay for text contrast -->
  <rect width="1200" height="480" fill="#1b2e1c" opacity="0.55" />
</svg>

