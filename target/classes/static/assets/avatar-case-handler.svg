    <!-- Head -->
    <ellipse cx="50" cy="46" rx="16" ry="19" fill="#FFE0B2" />
    
    <!-- Short Professional Hair -->
    <path d="M32 42 C32 26 68 26 68 42 C64 32 58 30 50 31 C42 30 36 32 32 42 Z" fill="#3E2723" />

    <!-- Glasses -->
    <rect x="39" y="42" width="9" height="7" rx="2" fill="none" stroke="#37474F" stroke-width="1.6" />
    <rect x="52" y="42" width="9" height="7" rx="2" fill="none" stroke="#37474F" stroke-width="1.6" />
    <line x1="48" y1="45" x2="52" y2="45" stroke="#37474F" stroke-width="1.6" />

    <!-- Eyes & Smile -->
    <circle cx="43.5" cy="45.5" r="1.5" fill="#212121" />
    <circle cx="56.5" cy="45.5" r="1.5" fill="#212121" />
    <path d="M46 54 Q50 57 54 54" stroke="#D84315" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#81C784" stroke-width="2" />
</svg>

