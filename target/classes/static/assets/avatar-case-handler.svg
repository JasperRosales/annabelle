      <circle cx="50" cy="50" r="48" />
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <rect width="100" height="100" fill="#E0F2F1" />
    
    <!-- Shoulders / Suit -->
    <path d="M15 100 L18 80 L35 72 L65 72 L82 80 L85 100 Z" fill="#263238" />
